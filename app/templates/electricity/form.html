{% extends "base.html" %}

{% block title %}登錄電費帳單 - RoomieCo{% endblock %}

{% block content %}
<div class="row mb-4">
    <div class="col-12">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="{{ url_for('electricity.list_bills') }}" class="text-decoration-none text-warning">智慧電費</a></li>
                <li class="breadcrumb-item active" aria-current="page">登錄新帳單</li>
            </ol>
        </nav>
    </div>
</div>

<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card main-card p-4">
            <h3 class="font-weight-bold text-dark mb-4"><i class="bi bi-file-earmark-plus-fill text-warning me-2"></i>登錄台電電費帳單</h3>
            <p class="text-muted">請輸入本期台電帳單的「總金額」、「總用電度數」與「計費起迄期間」。</p>
            
            <form action="{{ url_for('electricity.create_bill') }}" method="POST">
                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label for="total_amount" class="form-label font-weight-bold">帳單總金額 <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text bg-light font-weight-bold text-muted">$</span>
                            <input type="number" step="0.01" class="form-control" id="total_amount" name="total_amount" 
                                   value="{{ total_amount if total_amount else '' }}" 
                                   placeholder="0.00" min="0.01" required style="border-radius: 0 8px 8px 0;">
                        </div>
                        <div class="form-text text-muted">台電帳單應繳總金額。</div>
                    </div>
                    <div class="col-md-6">
                        <label for="total_kwh" class="form-label font-weight-bold">總用電度數 <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <input type="number" step="0.1" class="form-control" id="total_kwh" name="total_kwh" 
                                   value="{{ total_kwh if total_kwh else '' }}" 
                                   placeholder="0.0" min="0.1" required style="border-radius: 8px 0 0 8px;">
                            <span class="input-group-text bg-light font-weight-bold text-muted">度</span>
                        </div>
                        <div class="form-text text-muted">帳單上顯示的總用電度數。</div>
                    </div>
                </div>
                
                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <label for="period_start" class="form-label font-weight-bold">計費開始日期 <span class="text-danger">*</span></label>
                        <input type="date" class="form-control" id="period_start" name="period_start" 
                               value="{{ period_start if period_start else '' }}" required style="border-radius: 8px;">
                    </div>
                    <div class="col-md-6">
                        <label for="period_end" class="form-label font-weight-bold">計費結束日期 <span class="text-danger">*</span></label>
                        <input type="date" class="form-control" id="period_end" name="period_end" 
                               value="{{ period_end if period_end else '' }}" required style="border-radius: 8px;">
                    </div>
                </div>
                
                <div class="d-flex gap-2">
                    <a href="{{ url_for('electricity.list_bills') }}" class="btn btn-light w-25" style="border-radius: 10px; font-weight: 600;">
                        取消
                    </a>
                    <button type="submit" class="btn btn-gradient-primary w-75">
                        確認登錄
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
