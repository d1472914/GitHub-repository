{% extends "base.html" %}

{% block title %}登錄電費帳單 - 宿舍共好{% block title_end %}{% endblock %}{% endblock %}

{% block content %}
<div class="row g-4 justify-content-center">
    <div class="col-md-8">
        <div class="card p-4">
            <h2 class="card-title text-danger mb-2"><i class="bi bi-file-earmark-medical"></i> 登錄新期電費帳單</h2>
            <p class="text-muted small mb-4">輸入本期電力公司的電費單資訊。建立帳單後，室友將需要登錄各自的私有電表度數，系統將自動按用電量比例完成個人/公用電費的智慧分攤。</p>

            <form action="/electricity" method="POST">
                <div class="row g-3 mb-3">
                    <!-- 電費總金額 -->
                    <div class="col-sm-6">
                        <div class="form-group">
                            <label class="form-label" for="total_amount">帳單總金額 (TWD)</label>
                            <div class="input-group">
                                <span class="input-group-text bg-dark border-secondary text-muted">$</span>
                                <input type="number" step="0.01" min="0.01" id="total_amount" name="total_amount" class="form-control" placeholder="如：3200" required>
                            </div>
                        </div>
                    </div>
                    <!-- 電費總度數 -->
                    <div class="col-sm-6">
                        <div class="form-group">
                            <label class="form-label" for="total_kwh">用電總度數 (kWh)</label>
                            <div class="input-group">
                                <input type="number" step="0.1" min="0.1" id="total_kwh" name="total_kwh" class="form-control" placeholder="如：850" required>
                                <span class="input-group-text bg-dark border-secondary text-muted">度</span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="row g-3 mb-4">
                    <!-- 計費起日 -->
                    <div class="col-sm-6">
                        <div class="form-group">
                            <label class="form-label" for="period_start">計費起始日期</label>
                            <input type="date" id="period_start" name="period_start" class="form-control" required>
                        </div>
                    </div>
                    <!-- 計費迄日 -->
                    <div class="col-sm-6">
                        <div class="form-group">
                            <label class="form-label" for="period_end">計費結束日期</label>
                            <input type="date" id="period_end" name="period_end" class="form-control" required>
                        </div>
                    </div>
                </div>

                <!-- 按鈕 -->
                <div class="d-flex justify-content-end gap-2">
                    <a href="/electricity" class="btn btn-secondary px-4">取消</a>
                    <button type="submit" class="btn btn-danger px-4"><i class="bi bi-check-lg"></i> 確認登錄</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
