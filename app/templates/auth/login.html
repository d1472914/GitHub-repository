{% extends "base.html" %}

{% block title %}登入 - 宿舍共好{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <h2 class="auth-title">登入宿舍共好</h2>
        <p class="auth-subtitle">歡迎回來！請輸入您的帳號與密碼</p>
        
        <form action="{{ url_for('auth.login') }}" method="POST" class="auth-form">
            <div class="form-group">
                <label for="email">電子郵件 (Email)</label>
                <input type="email" id="email" name="email" required placeholder="example@example.com" class="form-control">
            </div>
            
            <div class="form-group">
                <label for="password">密碼</label>
                <input type="password" id="password" name="password" required placeholder="請輸入密碼" class="form-control">
            </div>
            
            <button type="submit" class="btn btn-primary btn-block">登入</button>
        </form>
        
        <div class="auth-footer">
            <p>還沒有帳號嗎？ <a href="{{ url_for('auth.register_page') }}">立即註冊</a></p>
        </div>
    </div>
</div>
{% endblock %}
