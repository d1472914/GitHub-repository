{% extends "base.html" %}

{% block title %}登入 - 宿舍共好{% endblock %}

{% block content %}
<div class="card" style="max-width: 500px; margin: 40px auto;">
    <h2 class="card-title">🔑 帳號登入</h2>
    <form action="/auth/login" method="POST">
        <div class="form-group">
            <label class="form-label" for="email">電子信箱</label>
            <input type="email" id="email" name="email" class="form-control" placeholder="example@email.com" required>
        </div>
        <div class="form-group">
            <label class="form-label" for="password">密碼</label>
            <input type="password" id="password" name="password" class="form-control" placeholder="請輸入密碼" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">登入</button>
    </form>
    <div style="margin-top: 20px; text-align: center; font-size: 0.9rem;">
        <span style="color: var(--text-muted);">還沒有帳號嗎？</span>
        <a href="/auth/register" style="color: var(--primary); text-decoration: none; font-weight: 600;">立即註冊</a>
    </div>
</div>
{% endblock %}
