{% extends "base.html" %}

{% block title %}登入 - RoomieCo{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 60vh;">
    <div class="col-md-5">
        <div class="card main-card p-4">
            <div class="text-center mb-4">
                <i class="bi bi-people-fill text-primary" style="font-size: 3rem; background: var(--primary-grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent;"></i>
                <h3 class="mt-3 font-weight-bold">歡迎回到 RoomieCo</h3>
                <p class="text-muted">讓系統當黑臉，讓室友做朋友。</p>
            </div>
            
            <form action="{{ url_for('auth.login_page') }}" method="POST">
                <div class="mb-3">
                    <label for="email" class="form-label font-weight-bold">電子郵件 (Email)</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white border-end-0"><i class="bi bi-envelope text-muted"></i></span>
                        <input type="email" class="form-control border-start-0 ps-0" id="email" name="email" value="{{ email if email else '' }}" required placeholder="yourname@example.com">
                    </div>
                </div>
                
                <div class="mb-4">
                    <label for="password" class="form-label font-weight-bold">密碼</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white border-end-0"><i class="bi bi-lock text-muted"></i></span>
                        <input type="password" class="form-control border-start-0 ps-0" id="password" name="password" required placeholder="請輸入密碼">
                    </div>
                </div>
                
                <button type="submit" class="btn btn-gradient-primary w-100 py-2">登入</button>
            </form>
            
            <div class="text-center mt-4">
                <span class="text-muted">還沒有帳號嗎？</span>
                <a href="{{ url_for('auth.register_page') }}" class="text-primary font-weight-bold text-decoration-none">立即註冊</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
