{% extends "base.html" %}

{% block title %}登入 - 室友共好{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 60vh;">
    <div class="col-md-5">
        <div class="card card-custom border-0 shadow">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <h2 class="fw-bold text-primary mb-1">歡迎回來</h2>
                    <p class="text-muted">登入您的帳號以管理室友生活</p>
                </div>
                <form action="{{ url_for('auth.login') }}" method="POST">
                    <div class="mb-3">
                        <label for="email" class="form-label font-monospace small text-muted">電子信箱 (Email)</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-0 text-muted"><i class="bi bi-envelope"></i></span>
                            <input type="email" class="form-control bg-light border-0" id="email" name="email" placeholder="example@email.com" required>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label for="password" class="form-label font-monospace small text-muted">密碼 (Password)</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-0 text-muted"><i class="bi bi-lock"></i></span>
                            <input type="password" class="form-control bg-light border-0" id="password" name="password" placeholder="請輸入密碼" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-gradient-primary w-100 py-2.5 rounded-3 mb-3">
                        <i class="bi bi-box-arrow-in-right me-1"></i>登入
                    </button>
                    <div class="text-center">
                        <span class="text-muted small">還沒有帳號嗎？</span>
                        <a href="{{ url_for('auth.register') }}" class="text-decoration-none small fw-semibold text-primary">立即註冊</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
