{% extends "base.html" %}

{% block title %}註冊 - 宿舍共好{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <h2 class="auth-title">註冊帳號</h2>
        <p class="auth-subtitle">加入宿舍共好，共同維護良好的宿舍與租屋生活</p>
        
        <form action="{{ url_for('auth.register') }}" method="POST" class="auth-form">
            <div class="form-group">
                <label for="nickname">暱稱 / 姓名</label>
                <input type="text" id="nickname" name="nickname" required placeholder="例如：阿明" class="form-control">
            </div>
            
            <div class="form-group">
                <label for="email">電子郵件 (Email)</label>
                <input type="email" id="email" name="email" required placeholder="example@example.com" class="form-control">
            </div>
            
            <div class="form-group">
                <label for="password">密碼</label>
                <input type="password" id="password" name="password" required placeholder="至少 6 位密碼" class="form-control">
            </div>
            
            <div class="form-group">
                <label for="confirm_password">確認密碼</label>
                <input type="password" id="confirm_password" name="confirm_password" required placeholder="再次輸入密碼" class="form-control">
            </div>
            
            <button type="submit" class="btn btn-primary btn-block">註冊</button>
        </form>
        
        <div class="auth-footer">
            <p>已經有帳號了嗎？ <a href="{{ url_for('auth.login_page') }}">立即登入</a></p>
        </div>
    </div>
</div>
{% endblock %}
