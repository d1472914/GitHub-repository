{% extends "base.html" %}

{% block title %}加入或建立群組 - RoomieCo{% endblock %}

{% block content %}
<div class="row justify-content-center my-5">
    <div class="col-md-8 col-lg-6 text-center">
        <div class="mb-4">
            <i class="bi bi-house-add text-primary" style="font-size: 4rem;"></i>
        </div>
        <h2 class="font-weight-bold mb-3">歡迎使用室友共好系統！</h2>
        <p class="text-muted mb-5">為了開始共同管理公約、開支與家事，您需要先建立一個新的宿舍/公寓群組，或是加入室友已經建立的群組。</p>
        
        <div class="row g-4">
            <div class="col-md-6">
                <div class="card main-card h-100 p-4 d-flex flex-column justify-content-between">
                    <div>
                        <i class="bi bi-plus-circle text-primary fs-1 mb-3 d-block"></i>
                        <h4 class="font-weight-bold mb-2">建立新群組</h4>
                        <p class="text-muted" style="font-size: 0.9rem;">如果您是宿舍長或第一個註冊的人，可以建立一個全新的群組並分享邀請碼給室友。</p>
                    </div>
                    <div class="mt-4">
                        <a href="{{ url_for('group.create_group') }}" class="btn btn-gradient-primary w-100">
                            <i class="bi bi-plus-lg me-1"></i>建立群組
                        </a>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card main-card h-100 p-4 d-flex flex-column justify-content-between">
                    <div>
                        <i class="bi bi-people text-success fs-1 mb-3 d-block"></i>
                        <h4 class="font-weight-bold mb-2">加入已有群組</h4>
                        <p class="text-muted" style="font-size: 0.9rem;">如果您的室友已經建立了群組，請向他們索取邀請碼，並在此輸入以加入他們的行列。</p>
                    </div>
                    <div class="mt-4">
                        <a href="{{ url_for('group.join_group') }}" class="btn btn-gradient-secondary w-100">
                            <i class="bi bi-door-open me-1"></i>輸入邀請碼
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
