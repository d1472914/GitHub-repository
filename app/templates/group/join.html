{% extends "base.html" %}

{% block title %}加入群組 - 宿舍共好{% endblock %}

{% block content %}
<div class="card" style="max-width: 600px; margin: 40px auto;">
    <h2 class="card-title">🔑 加入已存在的群組</h2>
    <p style="color: var(--text-muted); font-size: 0.95rem; margin-bottom: 25px; line-height: 1.5;">
        輸入室友分享給您的群組邀請碼，即可立刻加入群組並共享所有公約與記錄！
    </p>
    <form action="/group/join" method="POST">
        <div class="form-group">
            <label class="form-label" for="invite_code">邀請碼</label>
            <input type="text" id="invite_code" name="invite_code" class="form-control" placeholder="請輸入邀請碼" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">確認加入群組</button>
    </form>
</div>
{% endblock %}
