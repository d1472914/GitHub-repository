{% extends "base.html" %}

{% block title %}登記消費 - 室友共好{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card card-custom border-0 shadow">
            <div class="card-header card-header-custom">
                <i class="bi bi-cart-plus-fill text-success me-2"></i>登記新開支
            </div>
            <div class="card-body p-4">
                <form action="{{ url_for('expense.create_expense') }}" method="POST">
                    
                    <div class="mb-3">
                        <label for="title" class="form-label font-monospace small text-muted">消費項目名稱</label>
                        <input type="text" class="form-control" id="title" name="title" placeholder="例如：廚房紙巾、公用清潔劑" required autocomplete="off">
                    </div>
                    
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="amount" class="form-label font-monospace small text-muted">總金額 (元)</label>
                            <div class="input-group">
                                <span class="input-group-text">$</span>
                                <input type="number" step="0.01" min="0.01" class="form-control" id="amount" name="amount" placeholder="0.00" required>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <label for="category" class="form-label font-monospace small text-muted">開支類別</label>
                            <select class="form-select" id="category" name="category">
                                <option value="" disabled selected>--- 請選擇類別 ---</option>
                                <option value="daily_goods">🛍️ 日常物資</option>
                                <option value="rent">🏠 房屋房租</option>
                                <option value="water_electricity">⚡ 水電瓦斯</option>
                                <option value="other">🏷️ 其他</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="mb-4">
                        <label class="form-label d-block font-monospace small text-muted">分攤室友 (預設勾選所有人)</label>
                        <div class="bg-light p-3 rounded-3">
                            <div class="row">
                                {% for m in members %}
                                    <div class="col-md-4 mb-2">
                                        <div class="form-check">
                                            <input class="form-check-input" type="checkbox" name="split_users[]" value="{{ m.id }}" id="user{{ m.id }}" checked>
                                            <label class="form-check-label" for="user{{ m.id }}">
                                                {{ m.nickname }}
                                            </label>
                                        </div>
                                    </div>
                                {% endfor %}
                            </div>
                        </div>
                    </div>
                    
                    <div class="d-flex justify-content-between align-items-center">
                        <a href="{{ url_for('expense.list_expenses') }}" class="btn btn-outline-secondary btn-sm px-3 rounded-pill hover-lift">
                            <i class="bi bi-x-circle me-1"></i>取消
                        </a>
                        <button type="submit" class="btn btn-gradient-success btn-sm px-4 rounded-pill hover-lift">
                            <i class="bi bi-check-circle-fill me-1"></i>確認送出
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
